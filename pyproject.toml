[project]
name = "guard-pl"
version = "0.1.0"
description = "Polish-language prompt safety classifier (kNN over sentence embeddings)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.40,<4.45",
    "torch>=2.0",
    "sentencepiece>=0.2",
    "sentence-transformers>=3.0,<4.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
    "setfit>=1.1.3",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "ruff>=0.15.12",
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
